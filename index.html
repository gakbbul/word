<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>개인 단어 학습</title>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <style>
    :root {
      --blue-50: #eff6ff;
      --blue-100: #dbeafe;
      --blue-500: #2563eb;
      --blue-600: #1d4ed8;
      --blue-700: #1e40af;
      --ink: #0f172a;
      --muted: #64748b;
      --line: #dbe4f0;
      --bg: #f7fbff;
      --white: #ffffff;
      --green: #16a34a;
      --red: #dc2626;
      --amber: #d97706;
      font-family: Inter, Pretendard, "Noto Sans KR", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      color: var(--ink);
      background:
        radial-gradient(circle at top left, rgba(37, 99, 235, 0.12), transparent 32rem),
        linear-gradient(180deg, #ffffff 0%, var(--bg) 46%, #edf6ff 100%);
      min-height: 100vh;
    }
    button, input, textarea, select { font: inherit; }
    button { border: 0; cursor: pointer; }
    button:disabled, input:disabled {
      cursor: not-allowed;
      opacity: 0.72;
    }
    textarea { resize: vertical; }

    .app-shell {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    .topbar {
      position: sticky;
      top: 0;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      padding: 1rem clamp(1rem, 4vw, 3rem);
      background: rgba(255, 255, 255, 0.84);
      backdrop-filter: blur(14px);
      border-bottom: 1px solid rgba(219, 228, 240, 0.75);
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      min-width: 0;
    }
    .brand-mark {
      width: 2.35rem;
      height: 2.35rem;
      border-radius: 0.75rem;
      display: grid;
      place-items: center;
      background: var(--blue-600);
      color: white;
      font-weight: 900;
      box-shadow: 0 12px 30px rgba(37, 99, 235, 0.28);
    }
    .brand-title {
      margin: 0;
      font-size: 1.12rem;
      line-height: 1.1;
      white-space: nowrap;
    }
    .brand-sub {
      color: var(--muted);
      font-size: 0.78rem;
      margin-top: 0.15rem;
    }
    .top-actions {
      display: flex;
      gap: 0.5rem;
      flex-wrap: wrap;
      justify-content: flex-end;
    }
    .screen {
      width: min(1120px, calc(100% - 2rem));
      margin: 0 auto;
      padding: 1.25rem 0 6rem;
      flex: 1;
    }
    .hero-band {
      display: grid;
      grid-template-columns: minmax(0, 1.6fr) minmax(16rem, 0.75fr);
      gap: 1rem;
      align-items: stretch;
      margin: 1rem 0 1.3rem;
    }
    .hero-copy {
      padding: clamp(1.25rem, 3vw, 2rem);
      border-radius: 1rem;
      color: white;
      background: linear-gradient(135deg, var(--blue-700), var(--blue-500));
      box-shadow: 0 18px 50px rgba(37, 99, 235, 0.22);
      min-height: 11rem;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      overflow: hidden;
    }
    .hero-copy h2 {
      margin: 0;
      font-size: clamp(1.75rem, 4vw, 3.2rem);
      line-height: 1.05;
      letter-spacing: 0;
    }
    .hero-copy p {
      margin: 0.85rem 0 0;
      max-width: 42rem;
      color: rgba(255, 255, 255, 0.86);
      line-height: 1.65;
    }
    .hero-stats {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 0.65rem;
      margin-top: 1.2rem;
    }
    .stat-pill {
      border: 1px solid rgba(255, 255, 255, 0.24);
      border-radius: 0.8rem;
      padding: 0.8rem;
      background: rgba(255, 255, 255, 0.12);
    }
    .stat-pill strong { display: block; font-size: 1.25rem; }
    .stat-pill span { font-size: 0.78rem; color: rgba(255, 255, 255, 0.8); }
    .quick-panel {
      border: 1px solid var(--line);
      background: rgba(255, 255, 255, 0.86);
      border-radius: 1rem;
      padding: 1rem;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 1rem;
    }
    .quick-panel h3 {
      margin: 0;
      font-size: 1rem;
    }
    .quick-panel p {
      margin: 0.3rem 0 0;
      color: var(--muted);
      line-height: 1.55;
      font-size: 0.9rem;
    }
    .btn {
      min-height: 2.6rem;
      padding: 0.72rem 1rem;
      border-radius: 0.78rem;
      background: var(--blue-600);
      color: white;
      font-weight: 750;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.45rem;
      transition: transform 0.15s ease, box-shadow 0.15s ease, background 0.15s ease;
    }
    .btn:hover { transform: translateY(-1px); box-shadow: 0 12px 24px rgba(37, 99, 235, 0.18); background: var(--blue-700); }
    .btn.secondary {
      background: white;
      color: var(--blue-700);
      border: 1px solid var(--line);
    }
    .btn.secondary:hover { background: var(--blue-50); box-shadow: none; }
    .btn.ghost {
      background: transparent;
      color: var(--blue-700);
      border: 1px solid transparent;
    }
    .btn.danger {
      background: #fee2e2;
      color: #991b1b;
    }
    .btn.small {
      min-height: 2.2rem;
      padding: 0.5rem 0.8rem;
      border-radius: 0.65rem;
      font-size: 0.88rem;
    }
    .section-head {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 1rem;
      margin: 1.25rem 0 0.75rem;
    }
    .section-head h2 {
      margin: 0;
      font-size: 1.24rem;
    }
    .section-head p {
      margin: 0.25rem 0 0;
      color: var(--muted);
      font-size: 0.9rem;
    }
    .deck-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(16rem, 1fr));
      gap: 0.9rem;
    }
    .deck-card {
      background: white;
      border: 1px solid var(--line);
      border-radius: 0.9rem;
      padding: 1rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
      min-height: 12.5rem;
      box-shadow: 0 14px 30px rgba(15, 23, 42, 0.04);
    }
    .deck-card h3 {
      margin: 0;
      font-size: 1.08rem;
      overflow-wrap: anywhere;
    }
    .deck-meta {
      display: flex;
      gap: 0.45rem;
      flex-wrap: wrap;
    }
    .chip {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.25rem;
      border-radius: 999px;
      min-height: 1.9rem;
      padding: 0.25rem 0.65rem;
      background: var(--blue-50);
      color: var(--blue-700);
      font-size: 0.78rem;
      font-weight: 750;
      border: 1px solid var(--blue-100);
    }
    .deck-preview {
      color: var(--muted);
      font-size: 0.9rem;
      line-height: 1.5;
      min-height: 2.7rem;
    }
    .deck-actions {
      display: flex;
      gap: 0.5rem;
      margin-top: auto;
      flex-wrap: wrap;
    }
    .empty-state {
      min-height: 18rem;
      border: 1px dashed #bfdbfe;
      border-radius: 1rem;
      background: rgba(255, 255, 255, 0.72);
      display: grid;
      place-items: center;
      text-align: center;
      padding: 2rem;
    }
    .empty-state h3 { margin: 0 0 0.4rem; }
    .empty-state p { margin: 0; color: var(--muted); line-height: 1.6; }
    .fab {
      position: fixed;
      right: clamp(1rem, 4vw, 2rem);
      bottom: clamp(1rem, 4vw, 2rem);
      width: 4rem;
      height: 4rem;
      border-radius: 50%;
      background: var(--blue-600);
      color: white;
      font-size: 2.2rem;
      line-height: 1;
      display: grid;
      place-items: center;
      box-shadow: 0 20px 40px rgba(37, 99, 235, 0.36);
      z-index: 20;
    }
    .fab:hover { background: var(--blue-700); }

    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.45);
      z-index: 50;
      display: grid;
      place-items: center;
      padding: 1rem;
    }
    .modal {
      width: min(960px, 100%);
      max-height: min(92vh, 820px);
      overflow: auto;
      background: white;
      border-radius: 1rem;
      box-shadow: 0 26px 70px rgba(15, 23, 42, 0.28);
      border: 1px solid rgba(255,255,255,0.3);
    }
    .modal-head {
      position: sticky;
      top: 0;
      z-index: 1;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      padding: 1rem;
      background: white;
      border-bottom: 1px solid var(--line);
    }
    .modal-head h2 { margin: 0; font-size: 1.15rem; }
    .modal-body { padding: 1rem; }
    .field-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 0.8rem;
    }
    .field {
      display: flex;
      flex-direction: column;
      gap: 0.38rem;
      margin-bottom: 0.8rem;
    }
    .field label {
      font-weight: 800;
      font-size: 0.86rem;
    }
    .field input, .field textarea, .field select {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 0.75rem;
      background: white;
      color: var(--ink);
      padding: 0.76rem 0.85rem;
      outline: none;
      min-height: 2.65rem;
    }
    .field textarea { min-height: 8rem; line-height: 1.5; }
    .field input:focus, .field textarea:focus, .field select:focus {
      border-color: var(--blue-500);
      box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.12);
    }
    .hint {
      color: var(--muted);
      font-size: 0.8rem;
      line-height: 1.45;
    }
    .tabs {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 0.4rem;
      background: var(--blue-50);
      padding: 0.35rem;
      border-radius: 0.85rem;
      margin-bottom: 1rem;
      border: 1px solid var(--blue-100);
    }
    .tab {
      min-height: 2.5rem;
      border-radius: 0.65rem;
      background: transparent;
      color: var(--blue-700);
      font-weight: 800;
      padding: 0.45rem;
    }
    .tab.active {
      background: white;
      color: var(--ink);
      box-shadow: 0 8px 18px rgba(37, 99, 235, 0.1);
    }
    .word-table {
      width: 100%;
      border-collapse: collapse;
      border: 1px solid var(--line);
      border-radius: 0.8rem;
      overflow: hidden;
      display: block;
      max-height: 15rem;
      overflow-y: auto;
    }
    .word-table table { width: 100%; border-collapse: collapse; }
    .word-table th, .word-table td {
      text-align: left;
      padding: 0.65rem;
      border-bottom: 1px solid var(--line);
      font-size: 0.9rem;
      vertical-align: top;
    }
    .word-table th {
      background: var(--blue-50);
      color: var(--blue-700);
      position: sticky;
      top: 0;
    }
    .modal-foot {
      display: flex;
      justify-content: space-between;
      gap: 0.75rem;
      flex-wrap: wrap;
      padding: 1rem;
      border-top: 1px solid var(--line);
      background: #fbfdff;
    }

    .set-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(12.5rem, 1fr));
      gap: 0.75rem;
    }
    .set-card {
      text-align: left;
      padding: 1rem;
      min-height: 8.5rem;
      border: 1px solid var(--line);
      border-radius: 0.9rem;
      background: white;
      color: var(--ink);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      box-shadow: 0 10px 24px rgba(15, 23, 42, 0.04);
    }
    .set-card:hover { border-color: #93c5fd; }
    .set-card strong { font-size: 1.05rem; }
    .mode-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 0.75rem;
      margin: 1rem 0;
    }
    .mode-card {
      min-height: 7.6rem;
      text-align: left;
      border: 1px solid var(--line);
      background: white;
      border-radius: 0.9rem;
      padding: 1rem;
      color: var(--ink);
    }
    .mode-card:hover { border-color: #93c5fd; background: #fbfdff; }
    .mode-card strong { display: block; margin-bottom: 0.35rem; }
    .mode-card span { color: var(--muted); font-size: 0.86rem; line-height: 1.45; }
    .study-wrap {
      display: grid;
      gap: 1rem;
    }
    .study-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      flex-wrap: wrap;
      padding: 0.75rem 0;
    }
    .progress {
      height: 0.65rem;
      background: var(--blue-100);
      border-radius: 999px;
      overflow: hidden;
      flex: 1;
      min-width: 10rem;
    }
    .progress > div {
      height: 100%;
      background: var(--blue-600);
      transition: width 0.2s ease;
    }
    .study-panel {
      min-height: 26rem;
      border: 1px solid var(--line);
      border-radius: 1rem;
      background: white;
      padding: clamp(1rem, 3vw, 2rem);
      display: grid;
      align-items: center;
      box-shadow: 0 18px 40px rgba(15, 23, 42, 0.05);
    }
    .memory-card {
      width: min(620px, 100%);
      min-height: 20rem;
      margin: 0 auto;
      border-radius: 1rem;
      border: 1px solid #bfdbfe;
      background: linear-gradient(180deg, #ffffff, #f8fbff);
      box-shadow: 0 24px 46px rgba(37, 99, 235, 0.14);
      padding: clamp(1rem, 4vw, 2rem);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 1rem;
      cursor: pointer;
      touch-action: pan-y;
      user-select: none;
      transition: transform 0.18s ease, box-shadow 0.18s ease;
    }
    .memory-card:active { transform: scale(0.995); }
    .memory-study-stack {
      width: min(620px, 100%);
      margin: 0 auto;
      display: grid;
      gap: 0.8rem;
    }
    .prompt {
      text-align: center;
      overflow-wrap: anywhere;
    }
    .prompt .eyebrow {
      color: var(--blue-700);
      font-weight: 850;
      font-size: 0.82rem;
      margin-bottom: 0.6rem;
    }
    .prompt h1 {
      margin: 0;
      font-size: clamp(2rem, 8vw, 4rem);
      line-height: 1.08;
      letter-spacing: 0;
    }
    .answer-panel {
      display: grid;
      grid-template-rows: 0fr;
      transition: grid-template-rows 0.25s ease;
      border-top: 1px solid var(--line);
    }
    .answer-panel.open { grid-template-rows: 1fr; }
    .answer-inner {
      overflow: hidden;
      text-align: center;
      color: var(--ink);
    }
    .answer-inner strong {
      display: block;
      padding-top: 1rem;
      font-size: clamp(1.35rem, 5vw, 2.1rem);
      overflow-wrap: anywhere;
    }
    .toggle-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.75rem;
      color: var(--muted);
      font-weight: 750;
      text-align: center;
    }
    .switch {
      width: 4.4rem;
      height: 2.1rem;
      border-radius: 999px;
      padding: 0.22rem;
      border: 1px solid #bfdbfe;
      background: var(--blue-100);
      display: flex;
      align-items: center;
      justify-content: flex-start;
    }
    .switch.on {
      justify-content: flex-end;
      background: var(--blue-600);
    }
    .knob {
      width: 1.62rem;
      height: 1.62rem;
      border-radius: 50%;
      background: white;
      box-shadow: 0 4px 10px rgba(15, 23, 42, 0.2);
    }
    .choices {
      display: grid;
      gap: 0.65rem;
      width: min(680px, 100%);
      margin: 1rem auto 0;
    }
    .choice {
      min-height: 3.4rem;
      border-radius: 0.8rem;
      border: 1px solid var(--line);
      background: white;
      color: var(--ink);
      text-align: left;
      padding: 0.85rem 1rem;
      font-weight: 750;
    }
    .choice.correct { border-color: #86efac; background: #f0fdf4; color: #166534; }
    .choice.wrong { border-color: #fecaca; background: #fef2f2; color: #991b1b; }
    .spell-box {
      width: min(620px, 100%);
      margin: 0 auto;
      display: grid;
      gap: 1rem;
    }
    .spell-box input {
      min-height: 3.5rem;
      border-radius: 0.85rem;
      border: 1px solid var(--line);
      padding: 0.8rem 1rem;
      font-size: 1.2rem;
    }
    .result-box {
      width: min(680px, 100%);
      margin: 0 auto;
      text-align: center;
      display: grid;
      gap: 1rem;
    }
    .feedback {
      min-height: 1.6rem;
      text-align: center;
      font-weight: 800;
    }
    .feedback.ok { color: var(--green); }
    .feedback.no { color: var(--red); }
    .segmented {
      display: inline-grid;
      grid-auto-flow: column;
      gap: 0.25rem;
      padding: 0.25rem;
      background: var(--blue-50);
      border: 1px solid var(--blue-100);
      border-radius: 0.75rem;
      max-width: 100%;
      overflow-x: auto;
    }
    .segment {
      min-height: 2.1rem;
      padding: 0.45rem 0.75rem;
      border-radius: 0.55rem;
      background: transparent;
      color: var(--blue-700);
      font-weight: 800;
      white-space: nowrap;
    }
    .segment.active {
      background: white;
      color: var(--ink);
      box-shadow: 0 6px 16px rgba(37, 99, 235, 0.1);
    }
    .toast {
      position: fixed;
      left: 50%;
      bottom: 1rem;
      transform: translateX(-50%);
      z-index: 100;
      width: min(92vw, 34rem);
      background: var(--ink);
      color: white;
      padding: 0.85rem 1rem;
      border-radius: 0.85rem;
      box-shadow: 0 20px 40px rgba(15, 23, 42, 0.25);
      text-align: center;
    }

    @media (max-width: 820px) {
      .hero-band { grid-template-columns: 1fr; }
      .mode-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .field-grid { grid-template-columns: 1fr; }
      .tabs { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .topbar { align-items: flex-start; }
      .brand-sub { display: none; }
    }
    @media (max-width: 560px) {
      .screen { width: min(100% - 1rem, 1120px); padding-bottom: 5.5rem; }
      .hero-stats { grid-template-columns: 1fr; }
      .mode-grid { grid-template-columns: 1fr; }
      .deck-grid { grid-template-columns: 1fr; }
      .fab { width: 3.5rem; height: 3.5rem; font-size: 2rem; }
      .modal-backdrop { padding: 0; align-items: end; }
      .modal { border-radius: 1rem 1rem 0 0; max-height: 94vh; }
      .prompt h1 { font-size: clamp(1.8rem, 12vw, 3.2rem); }
      .study-panel { min-height: 23rem; }
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useEffect, useMemo, useRef, useState } = React;
    const DEFAULT_GEMINI_API_KEY = "";
    const STORAGE_KEY = "personal-classcard-react-v1";
    const GEMINI_MODEL = "gemini-2.5-flash";

    const sampleDecks = [
      {
        id: crypto.randomUUID(),
        title: "기본 영단어",
        setSize: 10,
        createdAt: Date.now(),
        words: [
          { id: crypto.randomUUID(), word: "absorb", meaning: "흡수하다" },
          { id: crypto.randomUUID(), word: "benefit", meaning: "이익, 혜택" },
          { id: crypto.randomUUID(), word: "compare", meaning: "비교하다" },
          { id: crypto.randomUUID(), word: "detail", meaning: "세부 사항" },
          { id: crypto.randomUUID(), word: "effort", meaning: "노력" },
          { id: crypto.randomUUID(), word: "focus", meaning: "집중하다" },
          { id: crypto.randomUUID(), word: "growth", meaning: "성장" },
          { id: crypto.randomUUID(), word: "habit", meaning: "습관" },
          { id: crypto.randomUUID(), word: "improve", meaning: "향상시키다" },
          { id: crypto.randomUUID(), word: "journey", meaning: "여정" }
        ]
      }
    ];

    function App() {
      const [decks, setDecks] = usePersistentState("decks", sampleDecks);
      const [apiKey, setApiKey] = usePersistentState("geminiApiKey", DEFAULT_GEMINI_API_KEY);
      const [route, setRoute] = useState({ name: "home" });
      const [showAdd, setShowAdd] = useState(false);
      const [toast, setToast] = useState("");

      const stats = useMemo(() => {
        const wordCount = decks.reduce((sum, deck) => sum + deck.words.length, 0);
        const setCount = decks.reduce((sum, deck) => sum + getSets(deck).length, 0);
        return { wordCount, setCount, deckCount: decks.length };
      }, [decks]);

      function notify(message) {
        setToast(message);
        window.clearTimeout(window.__toastTimer);
        window.__toastTimer = window.setTimeout(() => setToast(""), 2600);
      }

      function saveDeck(deck) {
        setDecks(prev => [deck, ...prev]);
        setShowAdd(false);
        notify("단어장이 추가됐어요.");
      }

    function MemoryStudy({ words, direction, onExit }) {
      const [queue, setQueue] = useState(() => shuffle(words));
      const [known, setKnown] = useState(0);
      const [seen, setSeen] = useState(false);
      const swipeStart = useRef(null);
      const ignoreClick = useRef(false);
      const current = queue[0];
      const total = words.length;

      useEffect(() => {
        setQueue(shuffle(words));
        setKnown(0);
        setSeen(false);
      }, [words, direction]);

      if (!current) return <Complete title="암기 완료" subtitle={`${known}개 단어를 확인했어요.`} onExit={onExit} />;

      function nextCard() {
        setQueue(prev => {
          const [head, ...rest] = prev;
          return seen ? rest : [...rest, head];
        });
        if (seen) setKnown(prev => prev + 1);
        setSeen(false);
      }

      function handlePointerDown(event) {
        swipeStart.current = { x: event.clientX, y: event.clientY };
        ignoreClick.current = false;
      }

      function handlePointerUp(event) {
        if (!swipeStart.current) return;
        const dx = event.clientX - swipeStart.current.x;
        const dy = event.clientY - swipeStart.current.y;
        swipeStart.current = null;
        if (dx < -70 && Math.abs(dx) > Math.abs(dy) * 1.25) {
          ignoreClick.current = true;
          nextCard();
        }
      }

      function flipCard() {
        if (ignoreClick.current) {
          ignoreClick.current = false;
          return;
        }
        setSeen(prev => !prev);
      }

      return (
        <>
          <Progress done={known} total={total} label={`${known}/${total}`} />
          <div className="study-panel">
            <div className="memory-study-stack">
              <div
                className="memory-card"
                role="button"
                tabIndex="0"
                onClick={flipCard}
                onPointerDown={handlePointerDown}
                onPointerUp={handlePointerUp}
                onKeyDown={(event) => {
                  if (event.key === "Enter" || event.key === " ") {
                    event.preventDefault();
                    flipCard();
                  }
                  if (event.key === "ArrowLeft") nextCard();
                }}
              >
                <div className="prompt">
                  <div className="eyebrow">{seen ? "뜻을 확인했어요" : "먼저 떠올려 보세요"}</div>
                  <h1>{direction === "en-ko" ? current.word : current.meaning}</h1>
                </div>
                <div className={`answer-panel ${seen ? "open" : ""}`}>
                  <div className="answer-inner">
                    <strong>{direction === "en-ko" ? current.meaning : current.word}</strong>
                  </div>
                </div>
                <div className="toggle-row">
                  <span>{seen ? "왼쪽으로 밀면 알고 있는 단어로 넘겨요" : "카드를 누르면 뜻을 볼 수 있어요"}</span>
                </div>
              </div>
              <button className="btn" onClick={nextCard}>다음 카드</button>
            </div>
          </div>
        </>
      );
    }

    function RecallStudy({ words, direction, onExit }) {
      const [queue, setQueue] = useState(() => shuffle(words));
      const [done, setDone] = useState(0);
      const [selected, setSelected] = useState(null);
      const [feedback, setFeedback] = useState("");
      const [pendingResult, setPendingResult] = useState(null);
      const current = queue[0];
      const total = words.length;
      const choices = useMemo(() => current ? buildChoices(words, current, direction === "en-ko" ? "meaning" : "word", 5) : [], [words, current, direction]);

      useEffect(() => {
        setQueue(shuffle(words));
        setDone(0);
        setSelected(null);
        setFeedback("");
        setPendingResult(null);
      }, [words, direction]);

      if (!current) return <Complete title="리콜 완료" subtitle={`${done}개 문제를 맞혔어요.`} onExit={onExit} />;

      function answer(choice) {
        if (pendingResult) return;
        const target = direction === "en-ko" ? current.meaning : current.word;
        const ok = normalize(choice) === normalize(target);
        setSelected(choice);
        setFeedback(ok ? "정답이에요." : `오답이에요. 정답: ${target}`);
        setPendingResult({ ok });
      }

      function nextQuestion() {
        if (!pendingResult) return;
        setQueue(prev => {
          const [head, ...rest] = prev;
          return pendingResult.ok ? rest : [...rest, head];
        });
        if (pendingResult.ok) setDone(prev => prev + 1);
        setSelected(null);
        setFeedback("");
        setPendingResult(null);
      }

      return (
        <>
          <Progress done={done} total={total} label={`${done}/${total}`} />
          <div className="study-panel">
            <div className="spell-box">
              <div className="prompt">
                <div className="eyebrow">정답을 골라주세요</div>
                <h1>{direction === "en-ko" ? current.word : current.meaning}</h1>
              </div>
              <div className="choices">
                {choices.map(choice => {
                  const target = direction === "en-ko" ? current.meaning : current.word;
                  const state = selected === choice ? (normalize(choice) === normalize(target) ? "correct" : "wrong") : "";
                  return <button className={`choice ${state}`} key={choice} onClick={() => answer(choice)} disabled={!!pendingResult}>{choice}</button>;
                })}
              </div>
              <div className={`feedback ${feedback.startsWith("정답") ? "ok" : feedback ? "no" : ""}`}>{feedback}</div>
              {pendingResult && <button className="btn" onClick={nextQuestion}>다음 문제</button>}
            </div>
          </div>
        </>
      );
    }

    function SpellStudy({ words, onExit }) {
      const [queue, setQueue] = useState(() => shuffle(words));
      const [done, setDone] = useState(0);
      const [input, setInput] = useState("");
      const [feedback, setFeedback] = useState("");
      const [pendingResult, setPendingResult] = useState(null);
      const inputRef = useRef(null);
      const nextButtonRef = useRef(null);
      const current = queue[0];
      const total = words.length;

      useEffect(() => {
        setQueue(shuffle(words));
        setDone(0);
        setInput("");
        setFeedback("");
        setPendingResult(null);
      }, [words]);

      useEffect(() => {
        if (pendingResult) nextButtonRef.current?.focus();
      }, [pendingResult]);

      if (!current) return <Complete title="스펠 완료" subtitle={`${done}개 단어를 정확히 입력했어요.`} onExit={onExit} />;

      function submit(e) {
        e.preventDefault();
        if (pendingResult) return;
        if (!input.trim()) {
          setFeedback("정답을 입력해주세요.");
          inputRef.current?.focus();
          return;
        }
        const ok = normalize(input) === normalize(current.word);
        setFeedback(ok ? "정답이에요." : `오답이에요. 정답: ${current.word}`);
        setPendingResult({ ok });
      }

      function nextQuestion() {
        if (!pendingResult) return;
        setQueue(prev => {
          const [head, ...rest] = prev;
          return pendingResult.ok ? rest : [...rest, head];
        });
        if (pendingResult.ok) setDone(prev => prev + 1);
        setInput("");
        setFeedback("");
        setPendingResult(null);
        setTimeout(() => inputRef.current?.focus(), 0);
      }

      return (
        <>
          <Progress done={done} total={total} label={`${done}/${total}`} />
          <div className="study-panel">
            <form className="spell-box" onSubmit={submit}>
              <div className="prompt">
                <div className="eyebrow">뜻에 맞는 영어 단어를 입력하세요</div>
                <h1>{current.meaning}</h1>
              </div>
              <input
                ref={inputRef}
                autoFocus
                value={input}
                onChange={e => setInput(e.target.value)}
                onKeyDown={(event) => {
                  if (event.key === "Enter" && !event.nativeEvent.isComposing) {
                    submit(event);
                  }
                }}
                placeholder="영어 스펠 입력"
                disabled={!!pendingResult}
              />
              {!pendingResult ? (
                <button className="btn" type="submit">확인</button>
              ) : (
                <button ref={nextButtonRef} className="btn" type="button" onClick={nextQuestion} onKeyDown={(event) => {
                  if (event.key === "Enter") {
                    event.preventDefault();
                    nextQuestion();
                  }
                }}>다음 문제</button>
              )}
              <div className={`feedback ${feedback.startsWith("정답") ? "ok" : feedback ? "no" : ""}`}>{feedback}</div>
            </form>
          </div>
        </>
      );
    }

    function TestStudy({ words, direction, onExit }) {
      const [count, setCount] = useState(Math.min(10, words.length));
      const [started, setStarted] = useState(false);
      const [questions, setQuestions] = useState([]);
      const [index, setIndex] = useState(0);
      const [answers, setAnswers] = useState([]);
      const [input, setInput] = useState("");
      const current = questions[index];

      useEffect(() => {
        setStarted(false);
        setQuestions([]);
        setIndex(0);
        setAnswers([]);
        setInput("");
      }, [words, direction]);

      function start() {
        const pool = shuffle(words).slice(0, count);
        setQuestions(pool.map((word, i) => makeQuestion(word, words, direction, i)));
        setStarted(true);
      }

      function submit(value) {
        const given = value ?? input;
        const ok = normalize(given) === normalize(current.answer);
        setAnswers(prev => [...prev, { ...current, given, ok }]);
        setInput("");
        if (index + 1 < questions.length) setIndex(prev => prev + 1);
        else setIndex(prev => prev + 1);
      }

      if (!started) {
        return (
          <div className="study-panel">
            <div className="result-box">
              <h2 style={{ margin: 0 }}>테스트 설정</h2>
              <div className="field">
                <label>문제 개수</label>
                <select value={count} onChange={e => setCount(Number(e.target.value))}>
                  {Array.from({ length: words.length }, (_, i) => i + 1).map(num => <option key={num} value={num}>{num}문제</option>)}
                </select>
              </div>
              <button className="btn" onClick={start}>테스트 시작</button>
            </div>
          </div>
        );
      }

      if (!current) {
        const score = answers.filter(a => a.ok).length;
        return (
          <div className="study-panel">
            <div className="result-box">
              <h2 style={{ margin: 0 }}>점수 {score} / {answers.length}</h2>
              <p className="hint">틀린 문제를 확인하고 다시 학습해보세요.</p>
              <div className="word-table">
                <table>
                  <thead><tr><th>문제</th><th>내 답</th><th>정답</th></tr></thead>
                  <tbody>
                    {answers.filter(a => !a.ok).map((a, i) => <tr key={i}><td>{a.prompt}</td><td>{a.given || "미입력"}</td><td>{a.answer}</td></tr>)}
                    {answers.every(a => a.ok) && <tr><td colSpan="3">모두 맞혔어요.</td></tr>}
                  </tbody>
                </table>
              </div>
              <button className="btn" onClick={onExit}>완료</button>
            </div>
          </div>
        );
      }

      return (
        <>
          <Progress done={index} total={questions.length} label={`${Math.min(index + 1, questions.length)}/${questions.length}`} />
          <div className="study-panel">
            <div className="spell-box">
              <div className="prompt">
                <div className="eyebrow">{current.typeLabel}</div>
                <h1>{current.prompt}</h1>
              </div>
              {current.kind === "short" ? (
                <form className="spell-box" onSubmit={e => { e.preventDefault(); submit(); }}>
                  <input autoFocus value={input} onChange={e => setInput(e.target.value)} placeholder="정답 입력" />
                  <button className="btn">제출</button>
                </form>
              ) : (
                <div className="choices">
                  {current.choices.map(choice => <button className="choice" key={choice} onClick={() => submit(choice)}>{choice}</button>)}
                </div>
              )}
            </div>
          </div>
        </>
      );
    }

    function AddDeckModal({ apiKey, setApiKey, onClose, onSave, notify }) {
      const [title, setTitle] = useState("");
      const [setSize, setSetSize] = useState(20);
      const [tab, setTab] = useState("manual");
      const [manualWord, setManualWord] = useState("");
      const [manualMeaning, setManualMeaning] = useState("");
      const [textInput, setTextInput] = useState("");
      const [imageFile, setImageFile] = useState(null);
      const [words, setWords] = useState([]);
      const [busy, setBusy] = useState(false);

      function addManual() {
        const word = manualWord.trim();
        const meaning = manualMeaning.trim();
        if (!word || !meaning) return notify("단어와 뜻을 모두 입력해주세요.");
        setWords(prev => dedupeWords([...prev, makeWord(word, meaning)]));
        setManualWord("");
        setManualMeaning("");
      }

      function parseTextLocally() {
        const parsed = parseWordText(textInput);
        if (!parsed.length) return notify("읽을 수 있는 단어-뜻 형식이 없어요.");
        setWords(prev => dedupeWords([...prev, ...parsed]));
        notify(`${parsed.length}개 단어를 읽었어요.`);
      }

      async function parseTextWithGemini() {
        if (!textInput.trim()) return notify("분석할 텍스트를 붙여넣어주세요.");
        setBusy(true);
        try {
          const prompt = `다음 텍스트에서 영어 단어와 한국어 뜻을 추출해 JSON 배열만 반환해줘. 형식은 [{"word":"apple","meaning":"사과"}] 이고 설명은 넣지 마.\n\n${textInput}`;
          const result = await callGemini({ apiKey, parts: [{ text: prompt }] });
          const parsed = parseGeminiWords(result);
          if (!parsed.length) throw new Error("추출 결과가 비어 있어요.");
          setWords(prev => dedupeWords([...prev, ...parsed]));
          notify(`AI가 ${parsed.length}개 단어를 정리했어요.`);
        } catch (error) {
          notify(`AI 분석 실패: ${error.message}`);
        } finally {
          setBusy(false);
        }
      }

      async function parseImageWithGemini() {
        if (!imageFile) return notify("이미지를 먼저 선택해주세요.");
        setBusy(true);
        try {
          const data = await fileToBase64(imageFile);
          const prompt = "이미지 속 영어 단어장 내용을 읽고 영어 단어와 한국어 뜻을 추출해 JSON 배열만 반환해줘. 형식은 [{\"word\":\"apple\",\"meaning\":\"사과\"}] 이고 설명은 넣지 마. 표, 손글씨, 줄바꿈이 있어도 최대한 추론해줘.";
          const result = await callGemini({
            apiKey,
            parts: [
              { inline_data: { mime_type: imageFile.type || "image/jpeg", data } },
              { text: prompt }
            ]
          });
          const parsed = parseGeminiWords(result);
          if (!parsed.length) throw new Error("추출 결과가 비어 있어요.");
          setWords(prev => dedupeWords([...prev, ...parsed]));
          notify(`이미지에서 ${parsed.length}개 단어를 찾았어요.`);
        } catch (error) {
          notify(`이미지 분석 실패: ${error.message}`);
        } finally {
          setBusy(false);
        }
      }

      async function uploadSheet(file) {
        if (!file) return;
        const isCsv = /\.csv$/i.test(file.name) || file.type.includes("csv");
        const parsed = isCsv ? parseCsv(await file.text()) : await parseWorkbook(file);
        if (!parsed.length) return notify("파일에서 단어를 찾지 못했어요.");
        setWords(prev => dedupeWords([...prev, ...parsed]));
        notify(`${parsed.length}개 단어를 가져왔어요.`);
      }

      function save() {
        if (!title.trim()) return notify("단어장 이름을 입력해주세요.");
        if (!words.length) return notify("단어를 1개 이상 추가해주세요.");
        onSave({
          id: crypto.randomUUID(),
          title: title.trim(),
          setSize: Math.max(1, Number(setSize) || 20),
          words,
          createdAt: Date.now()
        });
      }

      return (
        <div className="modal-backdrop">
          <div className="modal" role="dialog" aria-modal="true">
            <div className="modal-head">
              <h2>단어장 추가</h2>
              <button className="btn secondary small" onClick={onClose}>닫기</button>
            </div>
            <div className="modal-body">
              <div className="field-grid">
                <div className="field">
                  <label>단어장 이름</label>
                  <input value={title} onChange={e => setTitle(e.target.value)} placeholder="예: 중간고사 1과" />
                </div>
                <div className="field">
                  <label>한 세트 단어 수</label>
                  <input type="number" min="1" value={setSize} onChange={e => setSetSize(e.target.value)} />
                </div>
              </div>
              <div className="field">
                <label>Gemini API 키</label>
                <input value={apiKey} onChange={e => setApiKey(e.target.value)} placeholder="Gemini API 키" />
                <div className="hint">개인용 단일 파일이라 브라우저 안에서 직접 호출합니다.</div>
              </div>

              <div className="tabs">
                <button className={`tab ${tab === "manual" ? "active" : ""}`} onClick={() => setTab("manual")}>직접 추가</button>
                <button className={`tab ${tab === "csv" ? "active" : ""}`} onClick={() => setTab("csv")}>CSV 업로드</button>
                <button className={`tab ${tab === "image" ? "active" : ""}`} onClick={() => setTab("image")}>이미지 AI</button>
                <button className={`tab ${tab === "text" ? "active" : ""}`} onClick={() => setTab("text")}>텍스트 AI</button>
              </div>

              {tab === "manual" && (
                <div className="field-grid">
                  <div className="field"><label>단어</label><input value={manualWord} onChange={e => setManualWord(e.target.value)} placeholder="apple" /></div>
                  <div className="field"><label>뜻</label><input value={manualMeaning} onChange={e => setManualMeaning(e.target.value)} placeholder="사과" /></div>
                  <button className="btn" onClick={addManual}>단어 추가</button>
                </div>
              )}

              {tab === "csv" && (
                <div className="field">
                  <label>엑셀 또는 CSV 파일</label>
                  <input type="file" accept=".xlsx,.xls,.csv,text/csv" onChange={e => uploadSheet(e.target.files[0])} />
                  <div className="hint">첫 번째 시트의 첫 두 열을 단어, 뜻으로 읽습니다. CSV도 사용할 수 있어요.</div>
                </div>
              )}

              {tab === "image" && (
                <div className="field">
                  <label>종이 단어장 이미지</label>
                  <input type="file" accept="image/*" onChange={e => setImageFile(e.target.files[0])} />
                  <button className="btn" onClick={parseImageWithGemini} disabled={busy}>{busy ? "분석 중..." : "AI로 이미지 분석"}</button>
                </div>
              )}

              {tab === "text" && (
                <div className="field">
                  <label>단어와 뜻이 들어있는 텍스트</label>
                  <textarea value={textInput} onChange={e => setTextInput(e.target.value)} placeholder={"apple - 사과\nbenefit: 이익\ncompare, 비교하다"}></textarea>
                  <div className="top-actions" style={{ justifyContent: "flex-start" }}>
                    <button className="btn secondary" onClick={parseTextLocally}>빠른 파싱</button>
                    <button className="btn" onClick={parseTextWithGemini} disabled={busy}>{busy ? "분석 중..." : "AI로 정리"}</button>
                  </div>
                </div>
              )}

              <div className="section-head">
                <div>
                  <h2>미리보기</h2>
                  <p>{words.length}개 단어가 준비됐어요.</p>
                </div>
                {words.length > 0 && <button className="btn secondary small" onClick={() => setWords([])}>비우기</button>}
              </div>
              <div className="word-table">
                <table>
                  <thead><tr><th>단어</th><th>뜻</th><th></th></tr></thead>
                  <tbody>
                    {words.map(item => (
                      <tr key={item.id}>
                        <td>{item.word}</td>
                        <td>{item.meaning}</td>
                        <td><button className="btn secondary small" onClick={() => setWords(prev => prev.filter(w => w.id !== item.id))}>삭제</button></td>
                      </tr>
                    ))}
                    {!words.length && <tr><td colSpan="3">추가된 단어가 없어요.</td></tr>}
                  </tbody>
                </table>
              </div>
            </div>
            <div className="modal-foot">
              <span className="hint">저장하면 이 브라우저에 보관됩니다.</span>
              <button className="btn" onClick={save}>단어장 저장</button>
            </div>
          </div>
        </div>
      );
    }

    function Progress({ done, total, label }) {
      const pct = total ? Math.min(100, Math.round((done / total) * 100)) : 0;
      return (
        <div className="study-top">
          <div className="progress"><div style={{ width: `${pct}%` }}></div></div>
          <strong>{label}</strong>
        </div>
      );
    }

    function Complete({ title, subtitle, onExit }) {
      return (
        <div className="study-panel">
          <div className="result-box">
            <h2 style={{ margin: 0 }}>{title}</h2>
            <p className="hint">{subtitle}</p>
            <button className="btn" onClick={onExit}>세트로 돌아가기</button>
          </div>
        </div>
      );
    }

    function usePersistentState(key, initialValue) {
      const [value, setValue] = useState(() => {
        try {
          const saved = localStorage.getItem(`${STORAGE_KEY}:${key}`);
          return saved ? JSON.parse(saved) : initialValue;
        } catch {
          return initialValue;
        }
      });
      useEffect(() => {
        localStorage.setItem(`${STORAGE_KEY}:${key}`, JSON.stringify(value));
      }, [key, value]);
      return [value, setValue];
    }

    function getSets(deck) {
      const size = Math.max(1, Number(deck.setSize) || 20);
      const sets = [];
      for (let i = 0; i < deck.words.length; i += size) sets.push(deck.words.slice(i, i + size));
      return sets;
    }

    function makeWord(word, meaning) {
      return { id: crypto.randomUUID(), word: String(word).trim(), meaning: String(meaning).trim() };
    }

    function normalize(value) {
      return String(value || "").trim().toLowerCase().replace(/\s+/g, " ");
    }

    function shuffle(items) {
      const arr = [...items];
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    }

    function buildChoices(words, current, key, count) {
      const correct = current[key];
      const wrongs = shuffle(words.filter(w => w.id !== current.id).map(w => w[key])).filter(Boolean);
      return shuffle([correct, ...wrongs.slice(0, count - 1)]).slice(0, count);
    }

    function makeQuestion(word, allWords, direction, index) {
      const types = ["choice", "short", "blank"];
      const kind = types[index % types.length];
      if (kind === "short") {
        return {
          kind,
          typeLabel: "단답형",
          prompt: direction === "en-ko" ? word.word : word.meaning,
          answer: direction === "en-ko" ? word.meaning : word.word
        };
      }
      if (kind === "blank") {
        return {
          kind: "choice",
          typeLabel: "빈칸 문제",
          prompt: `I want to remember the word “____” clearly. (${word.meaning})`,
          answer: word.word,
          choices: buildChoices(allWords, word, "word", 5)
        };
      }
      return {
        kind: "choice",
        typeLabel: "객관식",
        prompt: direction === "en-ko" ? word.word : word.meaning,
        answer: direction === "en-ko" ? word.meaning : word.word,
        choices: buildChoices(allWords, word, direction === "en-ko" ? "meaning" : "word", 5)
      };
    }

    function parseWordText(text) {
      return text
        .split(/\r?\n/)
        .map(line => line.trim())
        .filter(Boolean)
        .map(line => {
          const parts = line.split(/\s*(?:,|\t|:|：|-|–|—|=)\s*/);
          if (parts.length < 2) return null;
          return makeWord(parts[0], parts.slice(1).join(" "));
        })
        .filter(item => item && item.word && item.meaning);
    }

    function parseCsv(text) {
      return text
        .split(/\r?\n/)
        .map(line => splitCsvLine(line))
        .filter(cols => cols.length >= 2)
        .map(cols => makeWord(cols[0], cols[1]))
        .filter(item => item.word && item.meaning);
    }

    async function parseWorkbook(file) {
      if (!window.XLSX) throw new Error("엑셀 읽기 도구를 불러오지 못했어요.");
      const buffer = await file.arrayBuffer();
      const workbook = XLSX.read(buffer, { type: "array" });
      const sheet = workbook.Sheets[workbook.SheetNames[0]];
      const rows = XLSX.utils.sheet_to_json(sheet, { header: 1, blankrows: false });
      return rows
        .filter(row => row && row.length >= 2)
        .map(row => makeWord(row[0], row[1]))
        .filter(item => item.word && item.meaning);
    }

    function splitCsvLine(line) {
      const result = [];
      let current = "";
      let quoted = false;
      for (let i = 0; i < line.length; i++) {
        const char = line[i];
        if (char === '"' && line[i + 1] === '"') {
          current += '"';
          i++;
        } else if (char === '"') {
          quoted = !quoted;
        } else if (char === "," && !quoted) {
          result.push(current.trim());
          current = "";
        } else {
          current += char;
        }
      }
      result.push(current.trim());
      return result;
    }

    function dedupeWords(items) {
      const seen = new Set();
      return items.filter(item => {
        const key = `${normalize(item.word)}|${normalize(item.meaning)}`;
        if (seen.has(key)) return false;
        seen.add(key);
        return item.word && item.meaning;
      });
    }

    async function callGemini({ apiKey, parts }) {
      const response = await fetch('/api/gemini', {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({ parts })
      });
      const data = await response.json();
      if (!response.ok) throw new Error(data?.error?.message || "Gemini 요청이 실패했어요.");
      const text = data?.candidates?.[0]?.content?.parts?.map(part => part.text || "").join("\n").trim();
      if (!text) throw new Error("Gemini 응답이 비어 있어요.");
      return text;
    }

    function parseGeminiWords(text) {
      const cleaned = text.replace(/```json|```/g, "").trim();
      const jsonText = cleaned.match(/\[[\s\S]*\]/)?.[0] || cleaned;
      const parsed = JSON.parse(jsonText);
      if (!Array.isArray(parsed)) return [];
      return parsed
        .map(item => makeWord(item.word || item.english || item.term, item.meaning || item.korean || item.definition))
        .filter(item => item.word && item.meaning);
    }

    function fileToBase64(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(String(reader.result).split(",")[1]);
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
